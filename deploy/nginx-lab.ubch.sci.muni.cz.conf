# BioSCom, served at lab.ubch.sci.muni.cz -> 147.251.22.180.
# Installed as /etc/nginx/sites-available/lab.ubch.sci.muni.cz (same pattern as thermool/primerool).
# certbot --nginx rewrites the installed copy in place to add TLS and the 80 -> 443 redirect,
# so this repo file is the pre-certbot template only.

server {
    server_name lab.ubch.sci.muni.cz;

    location / {
        # 127.0.0.1, not "localhost": the app listens on IPv4 only.
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket realtime sync (/ws, 30s server heartbeat).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    listen 80;
    listen [::]:80;
}
